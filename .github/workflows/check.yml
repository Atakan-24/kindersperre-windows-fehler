name: Syntax and pure logic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 parsing and pure tests
        shell: powershell
        run: .\tests\Test-Logic.ps1
      - name: PowerShell 7 parsing and pure tests
        shell: pwsh
        run: .\tests\Test-Logic.ps1
      - name: Compile the Win32 idle helper without executing it
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $output = Join-Path $env:TEMP 'IdleProbe-ci.exe'
          & $compiler /nologo /target:winexe "/out:$output" .\IdleProbe.cs
          if ($LASTEXITCODE -ne 0) { throw 'IdleProbe compilation failed' }
